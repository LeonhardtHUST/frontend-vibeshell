name: Dev Shell CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22.13.0, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run test:package
      - name: Responsive browser coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}
          include-hidden-files: true
          path: |
            .scratch/artifacts/*.tgz
            .scratch/*unit.json
            .scratch/package-acceptance.json
            .scratch/installed-package.png
            .scratch/dev-shell-browser/report.json
            .scratch/dev-shell-browser/results/**
            playwright-report/**
          if-no-files-found: warn
